spring.application.name=airBnbApp

# DB Configuration
spring.datasource.url=jdbc:postgresql://${DB_HOSTNAME}:5432/${DB_NAME}
spring.datasource.username=${AWS_RDS_USERNAME}
spring.datasource.password=${AWS_RDS_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
server.servlet.context-path=/api/v1
frontend.url=http://localhost:8080
jwt.secretKey=${JWT_SECRET_KEY}
stripe.secret.key=${STRIPE_SECRET_KEY}
stripe.webhook.secret=${STRIPE_WEBHOOK_KEY}